name: Release checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      YAP_STUDIO_TEST_SHARD: ${{ matrix.shard }}/4
      YAP_STUDIO_RENDER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      # Test temp stays outside the checkout and home: the engine refuses config folders inside a
      # repository, and the owner-folder guard treats anything under home as the owner's.
      - name: Use the runner temp folder
        run: |
          mkdir -p /private/tmp/yap-ci
          echo "TMPDIR=/private/tmp/yap-ci" >> "$GITHUB_ENV"
          echo "PYTEST_ADDOPTS=--basetemp=/private/tmp/yap-ci/pytest -o tmp_path_retention_policy=failed" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install media and speech tools
        # Retry once: bottle downloads occasionally fail on hosted runners.
        run: brew install ffmpeg espeak-ng || { sleep 20; brew install ffmpeg espeak-ng; }
      - run: ffmpeg -version
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/yap-studio/renderer
            ~/Library/Caches/hyperframes
            ~/.cache/puppeteer
          key: render-${{ runner.os }}-${{ hashFiles('src/yap_studio/render/renderer-lock/package-lock.json') }}
      - run: uv sync --locked
      - name: Install shared renderer
        run: uv run yap-studio renderer install
      - run: uv cache prune --ci
      - run: uv run pytest -q -m render -n 3 --durations=20 -o faulthandler_timeout=600

  speech:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Test temp stays outside the checkout and home: the engine refuses config folders inside a
      # repository, and the owner-folder guard treats anything under home as the owner's.
      - name: Use the runner temp folder
        run: |
          mkdir -p /private/tmp/yap-ci
          echo "TMPDIR=/private/tmp/yap-ci" >> "$GITHUB_ENV"
          echo "PYTEST_ADDOPTS=--basetemp=/private/tmp/yap-ci/pytest -o tmp_path_retention_policy=failed" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install media and speech tools
        # Retry once: bottle downloads occasionally fail on hosted runners.
        run: brew install ffmpeg espeak-ng || { sleep 20; brew install ffmpeg espeak-ng; }
      - run: ffmpeg -version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-parakeet-tdt-0.6b-v3
      - run: uv sync --locked --extra asr
      - run: uv cache prune --ci
      - run: YAP_STUDIO_ASR_TESTS=1 uv run --extra asr pytest -q -m asr -n 3 --durations=20 -o faulthandler_timeout=600

  helpers:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Test temp stays outside the checkout and home: the engine refuses config folders inside a
      # repository, and the owner-folder guard treats anything under home as the owner's.
      - name: Use the runner temp folder
        run: |
          mkdir -p /private/tmp/yap-ci
          echo "TMPDIR=/private/tmp/yap-ci" >> "$GITHUB_ENV"
          echo "PYTEST_ADDOPTS=--basetemp=/private/tmp/yap-ci/pytest -o tmp_path_retention_policy=failed" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install media and speech tools
        # Retry once: bottle downloads occasionally fail on hosted runners.
        run: brew install ffmpeg espeak-ng || { sleep 20; brew install ffmpeg espeak-ng; }
      - run: ffmpeg -version
      - run: uv sync --locked
      - run: uv cache prune --ci
      - run: uv run pytest -q -m helpers -n 3 --durations=20 -o faulthandler_timeout=600
