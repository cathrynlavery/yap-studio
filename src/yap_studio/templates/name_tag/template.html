<html lang="en" data-composition-variables='[{"id":"paper_color","type":"color","label":"Paper color","default":"#F4F3EE"},{"id":"titlebar_color","type":"color","label":"Titlebar color","default":"#E4E1D8"},{"id":"bar_ink_color","type":"color","label":"Bar ink color","default":"#222222"},{"id":"ink_color","type":"color","label":"Ink color","default":"#222222"},{"id":"accent_color","type":"color","label":"Accent color","default":"#365A58"},{"id":"accent_ink_color","type":"color","label":"Accent ink color","default":"#FFFFFF"},{"id":"font_family","type":"string","label":"Font family","default":"\"Yap Studio Inter\", sans-serif"},{"id":"mono_family","type":"string","label":"Mono family","default":"\"Yap Studio Space Mono\", monospace"},{"id":"card_radius_px","type":"number","label":"Card radius px","default":16},{"id":"card_shadow","type":"string","label":"Card shadow","default":"0 10px 24px rgb(0 0 0 / 0.16)"},{"id":"panel_width_px","type":"number","label":"Panel width px","default":960},{"id":"panel_max_height_px","type":"number","label":"Panel max height px","default":272},{"id":"pad_x_px","type":"number","label":"Pad x px","default":40},{"id":"pad_top_px","type":"number","label":"Pad top px","default":24},{"id":"pad_bottom_px","type":"number","label":"Pad bottom px","default":64},{"id":"name","type":"string","label":"Name","default":""},{"id":"role","type":"string","label":"Role","default":""},{"id":"name_px","type":"number","label":"Name Px","default":52},{"id":"role_px","type":"number","label":"Role Px","default":32}]'>
<head>
<meta charset="utf-8">
<style>
/* BUNDLED_FONT_FACES */

* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#root { position: relative; display: flex; align-items: center; justify-content: center;
  padding: var(--card-pad-top) var(--card-pad-x) var(--card-pad-bottom);
  color: var(--card-ink); font-family: var(--card-font); isolation: isolate; }
.panel { width: var(--card-panel-width); max-height: var(--card-panel-height);
  background: var(--card-paper); border-radius: var(--card-radius); box-shadow: var(--card-shadow);
  padding: 24px; opacity: 0; overflow: hidden; }

.tag-panel { display: flex; align-items: stretch; padding: 0; min-height: 150px; }
.tab { width: 16px; flex: 0 0 16px; background: var(--card-accent); border-radius: var(--card-radius) 0 0 var(--card-radius); }
.identity { padding: 20px 28px; min-width: 0; }
.name { font-size: var(--card-name-size); line-height: 1.1; font-weight: 700; white-space: nowrap; }
.role { font-size: var(--card-role-size); line-height: 1.2; opacity: .75; white-space: nowrap; margin-top: 4px; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="name_tag" data-start="0" data-width="1040" data-height="360" data-duration="3">
<div class="panel tag-panel"><div class="tab"></div><div class="identity"><div class="name"></div><div class="role"></div></div></div>
</div>
<script>
(function () {
  "use strict";
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  const panel = root.querySelector(".panel");
  const tokens = {
    "paper": v.paper_color, "titlebar": v.titlebar_color, "bar-ink": v.bar_ink_color,
    "ink": v.ink_color, "accent": v.accent_color, "accent-ink": v.accent_ink_color,
    "font": v.font_family, "mono": v.mono_family, "radius": `${v.card_radius_px}px`,
    "shadow": v.card_shadow, "panel-width": `${v.panel_width_px}px`,
    "panel-height": `${v.panel_max_height_px}px`, "pad-x": `${v.pad_x_px}px`,
    "pad-top": `${v.pad_top_px}px`, "pad-bottom": `${v.pad_bottom_px}px`,
  };
  for (const [name, value] of Object.entries(tokens)) {
    root.style.setProperty(`--card-${name}`, value, "important");
  }
  root.style.width = `${root.dataset.width}px`;
  root.style.height = `${root.dataset.height}px`;
  const duration = Number(root.dataset.duration);
  const OUT = Math.min(0.3, duration * 0.15);
  const outStart = duration - OUT;
  function px(name, value) { root.style.setProperty(`--card-${name}`, `${value}px`, "important"); }
  gsap.set(panel, { opacity: 0, y: 8 });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(panel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: Math.min(0.3, outStart), ease: "power3.out" }, 0);

px("name-size", v.name_px); px("role-size", v.role_px);
root.querySelector(".name").textContent = v.name;
root.querySelector(".role").textContent = v.role;
tl.fromTo(root.querySelector(".tab"), { scaleY: 0 }, { scaleY: 1, duration: 0.38, transformOrigin: "top" }, 0.15);

  tl.fromTo(panel, { opacity: 1 }, { opacity: 0, duration: OUT, ease: "power2.in", immediateRender: false }, outStart);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["name_tag"] = tl;
})();
</script>
</body>
</html>
