<head><meta charset="utf-8"><style>

* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
.cap { position: absolute; left: 70px; right: 70px; text-align: center; }
.cap-bottom { display: flex; justify-content: center; }
.cap-line {
  position: relative; display: inline-block; max-width: 940px;
  font-family: var(--font_family); font-weight: 400; font-size: var(--size);
  line-height: 1.12; color: var(--text_color); letter-spacing: var(--spacing);

.cap-words { position: relative; z-index: 1; display: block; }
.cap-ground {
  position: absolute; z-index: -1; pointer-events: none;
}
.cap-mark {
  position: absolute; z-index: 0; background: var(--highlight_color);
  border-radius: 0.07em; opacity: 0;
}
.cap-line.cap-pill { text-shadow: none; }
.cap-line.cap-pill .cap-words { text-wrap: balance; }
.cap-line.cap-pill .cap-mark { opacity: 1; box-shadow: var(--shadow); }
.cap-line.cap-gradient .cap-words { filter: var(--gradient_shadow); }
.cap-line.cap-gradient .w {
  color: transparent; text-shadow: none;
  /* One sliced background carries the sweep across a word's line fragments. */
  background-image: linear-gradient(to right, var(--highlight_color),
    var(--gradient_tint) 50%, transparent calc(50% + 0.08em)),
    linear-gradient(var(--text_color), var(--text_color));
  background-size: 200% 100%, 100% 100%; background-repeat: no-repeat;
  background-position: calc(100% - 0.08em) 0, 0 0;
  background-clip: text; -webkit-background-clip: text;
}
.cap-slam .cap-words { display: grid; text-transform: uppercase; font-weight: 800; }
.cap-slam .w { grid-area: 1 / 1; white-space: nowrap; opacity: 0; transform-origin: center; }
.cap-weight-shift .cap-words { text-transform: lowercase; }
.cap-row { display: block; white-space: nowrap; }
.cap-line.cap-clip-wipe { text-shadow: none; }
.cap-clip-wipe .cap-words {
  text-transform: uppercase; font-weight: 800; filter: var(--clip_shadow);
}
.cap-clip-wipe .w { display: inline-grid; vertical-align: bottom; }
.cap-clip-wipe .cap-dim, .cap-clip-wipe .cap-reveal { grid-area: 1 / 1; }
.cap-rise-clip, .cap-rise-mover { display: contents; max-width: 100%; }
.cap-rise-mover { position: relative; }
.cap-slam .cap-rise-clip { grid-area: 1 / 1; }
.cap-clip-wipe .cap-rise-clip, .cap-clip-wipe .cap-rise-mover { vertical-align: bottom; }
.cap-slam.cap-spoken .cap-words { display: block; }
.cap-slam.cap-spoken .w { display: inline-block; opacity: 1; }
/* Registry ports keep a solid outlined copy of every spoken word. */
.cap-slam .w, .cap-weight-shift .w, .cap-clip-wipe .w {
  -webkit-text-stroke: 0.035em var(--legibility_ink); paint-order: stroke fill;
  filter: drop-shadow(1px 0 0 var(--legibility_halo))
    drop-shadow(-1px 0 0 var(--legibility_halo))
    drop-shadow(0 1px 0 var(--legibility_halo))
    drop-shadow(0 -1px 0 var(--legibility_halo));
}
.cap-slam .w.is-key, .cap-clip-wipe .w.is-key {
  --legibility_ink: var(--accent_ink); --legibility_halo: var(--accent_halo);
}
.cap-weight-shift .w { display: inline-block; }
.cap-port .w {
  display: inline-block; position: relative; isolation: isolate;
  vertical-align: baseline; transform-origin: center;
  -webkit-text-stroke: 0.035em var(--legibility_ink); paint-order: stroke fill;
}
.cap-port .cap-ink {
  position: relative; z-index: 1;
  filter: drop-shadow(1px 0 0 var(--legibility_halo))
    drop-shadow(-1px 0 0 var(--legibility_halo))
    drop-shadow(0 1px 0 var(--legibility_halo))
    drop-shadow(0 -1px 0 var(--legibility_halo));
}
.cap-port .cap-tile {
  position: absolute; z-index: 0; inset: -0.04em -0.08em;
  border-radius: 0.12em; opacity: 0;
  background: var(--highlight_color); transform-origin: left;
}
.cap-camera-follow .cap-words, .cap-glitch-rgb .cap-words,
.cap-highlight .cap-words, .cap-neon-glow .cap-words,
.cap-particle-burst .cap-words { font-weight: 800; text-transform: uppercase; }
.cap-blend-difference .cap-tile { border-radius: 0; }
.cap-difference {
  position: absolute; inset: 0; z-index: 0; opacity: 0;
  color: var(--text_color); mix-blend-mode: difference;
  transform: translate(0.04em, 0.04em); pointer-events: none;
}
.cap-highlight .cap-tile {
  background: linear-gradient(135deg, var(--highlight_color),
    color-mix(in srgb, var(--highlight_color) 85%, var(--text_color)));
}
:is(.cap-neon-glow, .cap-neon-accent, .cap-gradient-fill,
  .cap-glitch-rgb, .cap-particle-burst, .cap-texture) .cap-ink {
  display: inline-block; opacity: 1; filter: none; text-shadow: none;
  -webkit-text-stroke-width: max(4px, 0.1em); paint-order: stroke fill;
}
/* A stroke extends half its width outside the fill. Keep at least two phone
   pixels of opaque edge above the patterned rear rim at 1080 -> 360 size. */
.cap-gradient-fill .cap-ink, .cap-texture .cap-ink {
  -webkit-text-stroke-width: max(12px, 0.18em);
}
/* Effects are separate rear copies; neither blur nor tint paints over the core. */
.cap-effect {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  color: var(--highlight_color); -webkit-text-stroke: 0; text-shadow: none;
}
.cap-gradient-fill .cap-effect, .cap-texture .cap-effect {
  color: transparent; text-shadow: none;
  transform: scale(1.06, 1.3); transform-origin: center;
  background-clip: text; -webkit-background-clip: text;
  background-image: linear-gradient(90deg, var(--highlight_color), var(--core_edge) 30%,
    var(--highlight_color) 50%, var(--core_edge) 50.5%, var(--core_edge));
  background-size: 350% 100%; background-position: 100% 0;
}
.cap-texture .cap-effect {
  background-image: repeating-linear-gradient(115deg, var(--core_edge) 0 0.035em,
    var(--highlight_color) 0.045em 0.08em, var(--core_edge) 0.1em 0.14em);
  background-size: 200% 200%;
}
.cap-decode, .cap-layer {
  position: absolute; inset: 0; pointer-events: none;
  color: var(--highlight_color); opacity: 0;
}
.cap-decode { overflow: hidden; font-size: 0.5em; text-align: center; }
.cap-layer { z-index: 0; font-weight: 800; transform-origin: center; }
.cap-emoji {
  display: inline-block; position: relative; vertical-align: 0.02em;
  width: 0.65em; height: 0.65em; margin-left: 0.12em;
  border: 0.025em solid var(--accent_ink); border-radius: 50%;
  background: var(--highlight_color);
}
.cap-emoji::before {
  content: ''; position: absolute; width: 0.07em; height: 0.07em;
  top: 0.17em; left: 0.15em; border-radius: 50%;
  background: var(--accent_ink); box-shadow: 0.22em 0 var(--accent_ink);
}
.cap-emoji::after {
  content: ''; position: absolute; left: 0.14em; top: 0.28em;
  width: 0.32em; height: 0.19em; border-bottom: 0.035em solid var(--accent_ink);
  border-radius: 0 0 50% 50%;
}
.cap-particle {
  position: absolute; left: 50%; top: 50%; z-index: 0;
  width: 0.06em; height: 0.06em; border-radius: 50%;
  background: var(--highlight_color); opacity: 0; pointer-events: none;
}
.cap-pill-karaoke .cap-words {
  padding: 0.12em 0.3em; border-radius: 0.3em;
  background: var(--highlight_color); text-transform: lowercase;
  text-wrap: balance; font-weight: 700;
}
</style></head>
<body><div data-composition-id="captions" data-no-timeline
  data-width="1080" data-height="300" data-duration="3"></div>
<script>
(() => {
  'use strict';
  const MIN_SIZE_PX = 32;
  // Eight frames read as motion and finish before most spoken words.
  const RISE_FRAMES = 8;
  // Two frames separate consecutive words without slowing the phrase.
  const RISE_STAGGER_FRAMES = 2;
  // Travel uses the fitted line box so the distance follows the font size.
  const RISE_DISTANCE = 0.6;
  // Three frames soften the glyphs and ground as they first appear.
  const RISE_FADE_FRAMES = 3;
  // Even a subframe phrase needs a finite animation to seek.
  const RISE_MIN_FRAMES = 1;
  const SHRINK_PREFIX = 'yap-studio caption-shrink ';
  const v = window.__hyperframes.getVariables();
  const root = document.querySelector('[data-composition-id]');
  const duration = Number(root.dataset.duration);
  const bandTop = Number(v.band_top_px ?? 0);
  const bandHeight = Number(v.band_height_px) || Number(root.dataset.height);
  const offset = (time) => Math.max(0, Math.min(1, time / duration));
  const wordWindow = (phrase, index) => {
    const start = Math.min(phrase.end, Math.max(phrase.start, phrase.words[index].start));
    const next = index + 1 < phrase.words.length ? phrase.words[index + 1].start : phrase.end;
    return { start, next: Math.min(phrase.end, Math.max(start, next)) };
  };
  // Use the existing phrase curve for the individual word moves too.
  const ease = 'cubic-bezier(.2,.7,.2,1)';
  const wordRise = v.entrance === 'rise';
  const spoken = v.entrance === 'spoken';
  const wordEntrance = wordRise || spoken;
  const riseWindow = (phrase, index) => {
    const first = phrase.start * v.fps;
    const frames = Math.max(RISE_MIN_FRAMES, (phrase.end - phrase.start) * v.fps);
    let length = Math.min(RISE_FRAMES, frames);
    const stagger = Math.min(RISE_STAGGER_FRAMES,
      (frames - length) / Math.max(1, phrase.words.length - 1));
    let start = first + index * stagger;
    if (v.highlight_style === 'slam') {
      const window = wordWindow(phrase, index);
      start = window.start * v.fps;
      length = Math.max(RISE_MIN_FRAMES, Math.min(length, window.next * v.fps - start));
    }
    return { start: start / v.fps, end: (start + length) / v.fps };
  };
  const animateRise = (node, keys, timing = {}) => {
    const animation = node.animate(keys,
      { duration: duration * 1000, fill: 'both', easing: 'linear', ...timing });
    // Give every entrance effect the same origin before the renderer seeks.
    animation.pause();
    animation.currentTime = 0;
  };
  const fadeRise = (node, phrase) => {
    const finish = Math.min(phrase.end, phrase.start + RISE_FADE_FRAMES / v.fps);
    // Release the fade at rest so its opacity layer cannot change the original pixels.
    animateRise(node, [{ opacity: 0, offset: 0 }, { opacity: 1, offset: 1 }], {
      delay: phrase.start * 1000, duration: (finish - phrase.start) * 1000, fill: 'backwards',
    });
  };
  const shadow = `${v.shadow_x_px}px ${v.shadow_y_px}px ${v.shadow_blur_px}px ` +
    `rgb(0 0 0 / ${v.shadow_opacity})`;
  const phrases = JSON.parse(v.phrases);
  const registryLook = ['slam', 'weight_shift', 'clip_wipe'].includes(v.highlight_style);
  const portedLook = ['blend_difference', 'camera_follow', 'editorial_emphasis', 'emoji_pop',
    'glitch_rgb', 'gradient_fill', 'highlight', 'matrix_decode', 'neon_accent', 'neon_glow',
    'parallax_layers', 'particle_burst', 'pill_karaoke', 'texture'].includes(v.highlight_style);
  const effectPadding = portedLook ? Math.ceil(v.size_px * 0.25) : 0;
  // BEGIN_CAPTION_PORTS: sync_data.py copies these effects into the style preview.
  // Alpha layers cannot sample the footage. A solid fill plus opposite ink outline
  // keeps the letters readable on bright, dark and changing video backgrounds.
  const inkLuminance = (color) => {
    const channels = [1, 3, 5].map((i) => parseInt(color.slice(i, i + 2), 16) / 255);
    return channels.reduce((sum, c, i) => sum +
      (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4) *
      [0.2126, 0.7152, 0.0722][i], 0);
  };
  const inkContrast = (a, b) => {
    const first = inkLuminance(a), second = inkLuminance(b);
    return (Math.max(first, second) + 0.05) / (Math.min(first, second) + 0.05);
  };
  const readableInk = (color) => {
    const luminance = inkLuminance(color);
    // Use the exact luminance of #111111 at the 4.5:1 decision boundary.
    const dark = (luminance + 0.05) / 0.05560539162420272;
    const light = 1.05 / (luminance + 0.05);
    return Math.max(dark, light) < 4.5 ? '#000000' : dark >= light ? '#111111' : '#FFFFFF';
  };
  const solidCoreLook = ['neon_glow', 'neon_accent', 'gradient_fill', 'glitch_rgb',
    'particle_burst', 'texture'].includes(v.highlight_style);
  // BEGIN_CAPTION_CASE
  const caseTransforms = {pill_karaoke: 'lowercase', weight_shift: 'lowercase',
    clip_wipe: 'uppercase', camera_follow: 'uppercase', glitch_rgb: 'uppercase',
    highlight: 'uppercase', neon_glow: 'uppercase', particle_burst: 'uppercase', slam: 'uppercase'};
  const preserveWordCase = (word) => {
    const token = word.text.replace(/^[.,!?;:"'()[\]{}<>…“”‘’«»—–-]+|[.,!?;:"'()[\]{}<>…“”‘’«»—–-]+$/gu, '');
    return word.preserve_case || /\p{Lu}/u.test(token.slice(1)) || token === 'I' ||
      /^I['’]/u.test(token) || word.text.startsWith('.');
  };
  const captionWordCase = (word, mode) => {
    if (mode !== 'slam' && preserveWordCase(word)) return word.text;
    const transform = caseTransforms[mode];
    return transform === 'lowercase' ? word.text.toLowerCase() :
      transform === 'uppercase' ? word.text.toUpperCase() : word.text;
  };
  const applyWordCase = (span, word, mode) => {
    if (mode !== 'slam' && caseTransforms[mode] && preserveWordCase(word)) {
      span.style.textTransform = 'none';
    }
  };
  // END_CAPTION_CASE
  // All ports use finite Web Animations; the renderer can seek in either direction.
  const animateWord = (node, start, end, idle, active, settle = idle, ramp = 0.08) => {
    if (end <= start) return;
    const arrive = Math.min(start + ramp, end);
    node.animate([
      { ...idle, offset: 0 }, { ...idle, offset: offset(start), easing: ease },
      { ...active, offset: offset(arrive) }, { ...active, offset: offset(end) },
      { ...settle, offset: offset(end) }, { ...settle, offset: 1 },
    ], { duration: duration * 1000, fill: 'both', easing: 'linear' });
  };
  const decorateWord = (span, word, index, phrase) => {
    const mode = v.highlight_style;
    applyWordCase(span, word, mode);
    const start = Math.max(phrase.start, word.start);
    const next = index + 1 < phrase.words.length ? phrase.words[index + 1].start : phrase.end;
    const end = Math.min(phrase.end, Math.max(start, next));
    const spokenEnd = Math.min(end, Math.max(start, word.end));
    const key = index === (phrase.stress ?? 0);
    const ink = document.createElement('span');
    ink.className = 'cap-ink';
    ink.textContent = word.text;
    span.replaceChildren(ink);
    if (solidCoreLook) {
      // Keep requested ink when it contrasts with the accent. Otherwise choose
      // a safe fallback once. The opposite edge isolates it from the footage.
      const core = inkContrast(v.text_color, v.highlight_color) >= 4.5
        ? v.text_color : readableInk(v.highlight_color);
      const edge = readableInk(core);
      ink.style.color = core;
      ink.style.webkitTextStrokeColor = edge;
      ink.style.opacity = '1';
      ink.style.textShadow = 'none';
      ink.style.filter = 'none';
      ink.style.backgroundImage = 'none';
      span.style.setProperty('--core_edge', edge);
    }
    const effectCopy = () => {
      const effect = document.createElement('span');
      effect.className = 'cap-effect';
      effect.textContent = word.text;
      effect.style.color = v.highlight_color;
      // CSS owns the transparent patterned fill on these rear copies.
      if (mode === 'gradient_fill' || mode === 'texture') effect.style.color = 'transparent';
      span.append(effect);
      return effect;
    };
    if (key) {
      if (mode === 'editorial_emphasis' || mode === 'neon_accent') {
        span.style.fontSize = mode === 'editorial_emphasis' ? '1.45em' : '1.2em';
        span.style.fontWeight = '800';
      }
      if (mode === 'editorial_emphasis' && v.italic_stress) span.style.fontStyle = 'italic';
    }
    const accent = { color: v.highlight_color, webkitTextStrokeColor: readableInk(v.highlight_color) };
    const ordinary = { color: v.text_color, webkitTextStrokeColor: readableInk(v.text_color) };
    if (['highlight', 'blend_difference'].includes(mode)) {
      const tile = document.createElement('span');
      tile.className = 'cap-tile';
      span.append(tile);
      animateWord(tile, start, end, { opacity: 0, transform: 'scaleX(0.05)' },
        { opacity: 1, transform: 'scaleX(1)' });
      if (mode === 'blend_difference') {

          cap.style.top = `${bandTop + bandHeight / 2}px`;
          cap.style.bottom = 'auto';
          cap.style.transform = 'translateY(-50%)';
          continue;
        }
        words.replaceChildren();
        const rows = split < spans.length ? [[0, split], [split, spans.length]] : [[0, split]];
        if (phraseGround && weightShift) {
          // Reserve the heaviest row's width so emphasis cannot resize the phrase ground.
          words.style.width = `${Math.min(available, Math.max(...rows.map(([start, end]) =>
            measure(phrase.words.slice(start, end).map((word) => word.text).join(' ')))))}px`;
        }
        rows.forEach(([start, end], rowIndex) => {
          const row = document.createElement('div');
          row.className = 'cap-row';
          for (let i = start; i < end; i++) {
            if (i > start) row.append(document.createTextNode(' '));
            row.append(spans[i]);
          }
          words.append(row);
          if (!weightShift) return;
          row.style.fontWeight = `${rowIndex === 0 ? bold : light}`;
          row.style.opacity = rowIndex === 0 ? '1' : '0.75';
          if (rows.length === 1) return;
          const switchAt = Math.min(phrase.end, Math.max(phrase.start, phrase.words[split].start));
          const switchEnd = Math.min(switchAt + 0.1, phrase.end);
          const initial = { fontWeight: `${rowIndex === 0 ? bold : light}`,
            opacity: rowIndex === 0 ? 1 : 0.75 };
          const active = { fontWeight: `${rowIndex === 0 ? light : bold}`,
            opacity: rowIndex === 0 ? 0.75 : 1 };
          row.animate([
            { ...initial, offset: 0 }, { ...initial, offset: offset(switchAt), easing: ease },
            { ...active, offset: offset(switchEnd) }, { ...active, offset: 1 },
          ], { duration: duration * 1000, fill: 'both', easing: 'linear' });
        });
      }
    }
    if (v.highlight_style === 'camera_follow') {
      for (const { phrase, words } of measurements) {
        animateCamera(words, phrase);
      }
    }
    for (const { phrase, line, words } of measurements) {
      if (phrase.backing !== 'shadow') continue;
      const size = parseFloat(line.style.fontSize || v.size_px);
      const channels = [1, 3, 5].map((i) => parseInt(readableInk(v.text_color).slice(i, i + 2), 16));
      const ink = `rgb(${channels.join(' ')} / 0.9)`;
      const filter = getComputedStyle(words).filter;
      words.style.filter = (filter && filter !== 'none' ? `${filter} ` : '') +
        `drop-shadow(0 0 ${0.04 * size}px ${ink}) drop-shadow(0 0 ${0.12 * size}px ${ink})`;
    }
    for (const { line, words, phraseGround, groundPadding, groundMode, spoken } of measurements) {
      if (phraseGround) {
        const slam = v.highlight_style === 'slam' && !spoken;
        const scale = v.width_scale * (slam ? 0.8 : 1);
        const size = parseFloat(line.style.fontSize || v.size_px);
        const highlightPad = size * (v.highlight_style === 'pill' ? 0.4 :
          v.highlight_style === 'moving_block' ? 0.08 : 0);
        const bounds = groundBounds(line.offsetWidth, words.offsetHeight, scale,
          slam ? 1.3 : 1, highlightPad + effectPadding, groundPadding, groundMode);
        const ground = line.children[0];
        Object.assign(ground.style, {
          left: '50%', transform: 'translateX(-50%)',
          top: `${bounds.top}px`, width: `${bounds.width}px`,
          height: `${bounds.height}px`, borderRadius: `${bounds.radius}px`,
        });
      }
    }
    const finishLayout = () => {
      for (const { phrase, spans, spoken } of measurements) {
        if (!spoken) continue;
        spans.forEach((span, index) => {
          // Opacity keeps unseen words in the fitted flow, including their spaces.
          const wrapper = document.createElement('span');
          wrapper.className = 'cap-spoken-word';
          span.replaceWith(wrapper);
          wrapper.append(span);
          const { start } = wordWindow(phrase, index);
          const end = Math.min(phrase.end, start + 2 / v.fps);
          // Show ink on the spoken frame, then reach full opacity over three frames.
          animateRise(wrapper, [
            { opacity: 0, offset: 0 }, { opacity: 0, offset: offset(start) },
            { opacity: 1 / 3, offset: offset(start) },
            { opacity: 1, offset: offset(end) }, { opacity: 1, offset: 1 },
          ]);
        });
      }
      if (wordRise) {
        for (const { phrase, spans, line, words, mark, phraseGround } of measurements) {
          spans.forEach((span, i) => {
            // Fit the original word flow before adding the entrance wrappers.
            const clip = document.createElement('span');
            clip.className = 'cap-rise-clip';
            const mover = document.createElement('span');
            mover.className = 'cap-rise-mover';
            span.replaceWith(clip);
            mover.append(span);
            clip.append(mover);
            const { start, end } = riseWindow(phrase, i);
            const display = v.highlight_style === 'slam' ? 'grid' : 'inline-block';
            const distance = parseFloat(getComputedStyle(span).lineHeight) * RISE_DISTANCE;
            // Backwards fill clips the entrance and releases every effect once the word is up.
            const timing = { delay: start * 1000, duration: (end - start) * 1000,
              fill: 'backwards' };
            // Move in layout pixels so parent highlight transforms keep the original glyph paint.
            animateRise(mover, [
              { top: `${distance}px`, display, offset: 0, easing: ease },
              { top: '0px', display, offset: 1 },
            ], timing);
            fadeRise(mover, { start, end });
            // Leave the top and sides open; the bottom edge is the resting line box.
            const clipped = { display: 'inline-block', clipPath: 'inset(-100vmax -100vmax 0)' };
            animateRise(clip, [
              { ...clipped, offset: 0 }, { ...clipped, offset: 1 },
            ], timing);
          });
          if (phraseGround) fadeRise(line.children[0], phrase);
          if (v.highlight_style === 'pill') fadeRise(mark, phrase);
          if (v.highlight_style === 'pill_karaoke') fadeRise(words, phrase);
        }
      }
      const layout = measurements.map(({ phrase, spans, cap }, slot) => {
        const animations = cap.getAnimations({ subtree: true });
        const previous = animations.map((animation) => animation.currentTime);
        const envelopes = spans.map(() => null);
        try {
          for (let f = Math.max(0, Math.floor(phrase.start * v.fps));
            f <= Math.ceil(phrase.end * v.fps); f++) {
            animations.forEach((animation) => { animation.currentTime = f / v.fps * 1000; });
            spans.forEach((span, i) => {
              let opacity = 1;
              for (let el = span; el; el = el.parentElement) {
                opacity *= parseFloat(getComputedStyle(el).opacity);
                if (el === cap) break;
              }
              if (!(opacity > 0)) return;
              const rect = span.getBoundingClientRect();
              if (rect.width === 0 || rect.height === 0) return;
              let drawn = rect;
              const wrapper = wordRise ? span.parentElement.parentElement : null;
              if (wrapper && getComputedStyle(wrapper).display !== 'contents') {
                const clip = wrapper.getBoundingClientRect();
                drawn = { left: Math.max(rect.left, clip.left), top: Math.max(rect.top, clip.top),
                  right: Math.min(rect.right, clip.right), bottom: Math.min(rect.bottom, clip.bottom) };
                if (drawn.right <= drawn.left || drawn.bottom <= drawn.top) return;
              }
              const box = envelopes[i];
              envelopes[i] = box ? {
                left: Math.min(box.left, drawn.left), top: Math.min(box.top, drawn.top),
                right: Math.max(box.right, drawn.right), bottom: Math.max(box.bottom, drawn.bottom),
              } : { left: drawn.left, top: drawn.top, right: drawn.right, bottom: drawn.bottom };
            });
          }
        } finally {
          animations.forEach((animation, index) => { animation.currentTime = previous[index]; });
        }
        const boxes = envelopes.flatMap((box) => {
          if (!box) return [];
          const round = (value) => Math.round(value * 100) / 100;
          return [{ x: round(box.left), y: round(box.top),
            w: round(box.right - box.left), h: round(box.bottom - box.top) }];
        });
        return { slot, boxes };
      });
      console.warn(SHRINK_PREFIX + JSON.stringify({ floor_px, phrases: measurements.flatMap(
        ({ size, fits }, slot) => size < v.size_px || !fits ?
          [{ slot, size_px: Math.round(size * 100) / 100, fits }] : []), layout }));
    };
    if (!wordEntrance) finishLayout();
    if (registryLook) {
      if (wordEntrance) finishLayout();
      return;
    }
    if (v.highlight_style === 'pill') {
      for (const { spans, mark, line, size, bandHeight, padding } of measurements) {
        if (!spans.length) continue;
        const lineRect = line.getBoundingClientRect();
        const boxes = spans.map((span) => span.getBoundingClientRect());
        const padX = size * 0.4;
        const padY = size * 0.04;
        const shadowPad = v.shadow_opacity > 0 ?
          v.shadow_blur_px * 3 + Math.abs(v.shadow_x_px) : 0;
        const left = Math.max(shadowPad - lineRect.left,
          Math.min(...boxes.map((r) => r.left)) - lineRect.left - padX);
        const right = Math.min(1080 - shadowPad - lineRect.left,
          Math.max(...boxes.map((r) => r.right)) - lineRect.left + padX);
        const top = Math.max(-padding,
          Math.min(...boxes.map((r) => r.top)) - lineRect.top - padY);
        const bottom = Math.min(bandHeight - padding - v.entry_rise_px,
          Math.max(...boxes.map((r) => r.bottom)) - lineRect.top + padY);
        const height = bottom - top;
        const twoLines = Math.max(...boxes.map((r) => r.top)) -
          Math.min(...boxes.map((r) => r.top)) > size * 0.5;
        Object.assign(mark.style, {
          left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${height}px`,
          borderRadius: `${twoLines ? Math.min(height / 2, size * 0.6) : height / 2}px`,
        });
      }
      if (wordEntrance) finishLayout();
      return;
    }
    if (!['moving_block', 'underline'].includes(v.highlight_style)) {
      if (wordEntrance) finishLayout();
      return;
    }
    for (const { phrase, spans, mark, line, size } of measurements) {
      const lineRect = v.width_scale < 1 ? line.getBoundingClientRect() : null;
      const boxes = spans.map((span) => {
        const rect = lineRect ? span.getBoundingClientRect() : null;
        const r = rect ? {
          x: rect.left - lineRect.left, y: rect.top - lineRect.top, w: rect.width, h: rect.height,
        } : { x: span.offsetLeft, y: span.offsetTop, w: span.offsetWidth, h: span.offsetHeight };
        const pad = size * 0.08;
        const thickness = Math.max(6, size * 0.075);
        return v.highlight_style === 'moving_block' ? {
          left: `${r.x - pad}px`, top: `${r.y + r.h * 0.08}px`,
          width: `${r.w + pad * 2}px`, height: `${r.h * 0.86}px`,
        } : {
          left: `${r.x}px`, top: `${r.y + r.h * 0.9 - thickness / 2}px`,
          width: `${r.w}px`, height: `${thickness}px`,
        };
      });
      if (!boxes.length) continue;
      const keys = [{ ...boxes[0], offset: 0, opacity: 1 }];
      for (let i = 1; i < boxes.length; i++) {
        const { start, next } = wordWindow(phrase, i);
        keys.push({ ...boxes[i - 1], offset: offset(start), opacity: 1, easing: ease });
        keys.push({ ...boxes[i], offset: offset(Math.min(start + 0.16, next)), opacity: 1 });
      }
      keys.push({ ...boxes[boxes.length - 1], offset: 1, opacity: 1 });
      if (wordRise) {
        // One opacity track keeps the entrance and placement from competing.
        keys.forEach((key) => { delete key.opacity; });
        keys.push({ offset: 0, opacity: 0 }, { offset: offset(phrase.start), opacity: 0 },
          { offset: offset(Math.min(phrase.end, phrase.start + RISE_FADE_FRAMES / v.fps)), opacity: 1 },
          { offset: 1, opacity: 1 });
        keys.sort((a, b) => a.offset - b.offset);
      }
      mark.animate(keys, { duration: duration * 1000, fill: 'both', easing: 'linear' });
    }
    if (wordEntrance) finishLayout();
  });
})();
</script></body></html>
