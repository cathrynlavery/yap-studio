<head>
<meta charset="utf-8">
<style>
/* BUNDLED_FONT_FACES */
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#root {
  position: relative; display: flex; align-items: center; justify-content: center;
  padding: var(--card-pad-top) var(--card-pad-x) var(--card-pad-bottom);
  color: var(--card-ink); font-family: var(--card-font);
  isolation: isolate; pointer-events: none;
}
.panel {
  display: flex; align-items: center; gap: 28px; padding: 24px;
  width: var(--card-content-width); max-width: var(--card-panel-width);
  background: var(--card-paper); border-radius: var(--card-radius);
  box-shadow: var(--card-shadow); opacity: 0;
}
.tile {
  position: relative; flex: 0 0 160px; height: 160px; border-radius: 36px;
  background: var(--card-titlebar); opacity: 0;
}
.tile-content {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
  display: flex; align-items: center; justify-content: center; color: var(--card-bar-ink);
}
.tile-content img { width: 100%; height: 100%; object-fit: cover; }
.glyph { width: 96px; height: 96px; fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.label[hidden] { display: none; }
.slash-angle {
  position: absolute; width: 215px; height: 14px; left: 50%; top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
}
.slash {
  width: 100%; height: 100%; border-radius: 7px;
  background: var(--card-strike); box-shadow: 0 0 0 4px var(--card-paper);
  transform: scaleX(0); transform-origin: left center;
}
.label { font-size: var(--card-label-size); font-weight: 700; line-height: 1.2; white-space: pre; }
</style>
<script src="gsap.min.js"></script>

<body>
<div id="root" data-composition-id="icon_strike" data-start="0" data-width="1040" data-height="360" data-duration="3">
<div class="panel">
  <div class="tile">
    <div class="tile-content"><svg class="glyph" viewBox="0 0 96 96" aria-hidden="true"></svg></div>
    <div class="slash-angle"><div class="slash"></div></div>
  </div>
  <div class="label"></div>
</div>
</div>
<script>
(function () {
  "use strict";
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  const panel = root.querySelector(".panel");
  const tile = root.querySelector(".tile");
  const tokens = {
    "paper": v.paper_color, "titlebar": v.titlebar_color, "bar-ink": v.bar_ink_color,
    "ink": v.ink_color, "accent": v.accent_color, "accent-ink": v.accent_ink_color,
    "font": v.font_family, "mono": v.mono_family, "radius": `${v.card_radius_px}px`,
    "shadow": v.card_shadow, "panel-width": `${v.panel_width_px}px`,
    "panel-height": `${v.panel_max_height_px}px`, "pad-x": `${v.pad_x_px}px`,
    "pad-top": `${v.pad_top_px}px`, "pad-bottom": `${v.pad_bottom_px}px`,
  };
  for (const [name, value] of Object.entries(tokens)) {
    root.style.setProperty(`--card-${name}`, value, "important");
  }
  root.style.width = `${root.dataset.width}px`;
  root.style.height = `${root.dataset.height}px`;
  root.style.setProperty("--card-label-size", `${v.label_px}px`, "important");
  root.style.setProperty("--card-content-width", `${v.content_width_px}px`, "important");
  root.style.setProperty("--card-strike", v.strike_color, "important");
  const label = root.querySelector(".label");
  label.textContent = v.label;
  label.hidden = !v.label;
  const glyph = root.querySelector(".glyph");
  glyph.style.display = v.icon_src ? "none" : "block";
  if (v.icon_src) {
    if (!/^icon\.(png|jpe?g|webp)$/.test(v.icon_src)) {
      throw new Error("use a local icon filename");
    }
    const image = document.createElement("img");
    image.setAttribute("src", v.icon_src);
    image.setAttribute("alt", "");
    root.querySelector(".tile-content").appendChild(image);
  } else {
    const shapes = {
      app: [["rect", {x: 15, y: 15, width: 66, height: 66, rx: 14}],
        ...[[36, 36], [60, 36], [36, 60], [60, 60]].map(([cx, cy]) =>
          ["circle", {cx, cy, r: 3, fill: "currentColor", stroke: "none"}])],
      bell: [["path", {d: "M26 64h44l-6-10V40c0-11-6-18-16-18S32 29 32 40v14zM40 75q8 9 16 0M48 15v7"}]],
      chat: [["path", {d: "M20 20h56a8 8 0 0 1 8 8v32a8 8 0 0 1-8 8H43L25 80V68h-5a8 8 0 0 1-8-8V28a8 8 0 0 1 8-8z"}]],
      mail: [["rect", {x: 12, y: 22, width: 72, height: 52, rx: 8}],
        ["path", {d: "m15 27 33 25 33-25"}]],
      cart: [["path", {d: "M12 18h11l9 43h41l10-31H26"}],
        ["circle", {cx: 37, cy: 77, r: 5}], ["circle", {cx: 69, cy: 77, r: 5}]],
      clock: [["circle", {cx: 48, cy: 48, r: 34}], ["path", {d: "M48 26v24l16 10"}]],
    };
    for (const [tag, attributes] of shapes[v.glyph]) {
      const shape = document.createElementNS(glyph.namespaceURI, tag);
      for (const [name, value] of Object.entries(attributes)) shape.setAttribute(name, value);
      glyph.appendChild(shape);

  const content = root.querySelector(".tile-content");
  const slash = root.querySelector(".slash");
  const duration = Number(root.dataset.duration);
  const OUT = Math.min(0.3, duration * 0.15);
  const outStart = duration - OUT;
  gsap.set(panel, { opacity: 0, y: 8 });
  gsap.set(tile, { scale: 0.9, opacity: 0 });
  gsap.set(slash, { scaleX: 0 });

    { opacity: 0, duration: OUT, ease: "power2.in", immediateRender: false }, outStart);
  tl.seek(0);

  window.__timelines["icon_strike"] = tl;

</script>
