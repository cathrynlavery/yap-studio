<html data-composition-variables='[{"id":"frames","type":"number","label":"Frame count","default":12},{"id":"fps","type":"number","label":"Frame rate","default":30}]'>
<head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: black; }
canvas { display: block; width: 1080px; height: 1920px; }
</style></head>
<body><div data-composition-id="transition_whip_pan" data-no-timeline
  data-width="1080" data-height="1920" data-duration="0.399"></div>
<script>
(() => {
  'use strict';
  const v = window.__hyperframes.getVariables();
  const frames = Number(v.frames), fps = Number(v.fps), half = frames / 2;
  if (!Number.isInteger(frames) || frames < 6 || frames > 24 || frames % 2 || fps !== 30) {
    throw new Error('Invalid transition frames or fps');
  }
  const root = document.querySelector('[data-composition-id]');
  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1920;
  root.append(canvas);
  const gl = canvas.getContext('webgl', { alpha: false, preserveDrawingBuffer: true });
  if (!gl) throw new Error('Transition requires WebGL');
  const vertex = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){' +
    'v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}';
  const fragment = "precision mediump float;varying vec2 v_uv;uniform sampler2D u_from, u_to;uniform float u_progress;uniform vec2 u_resolution;\nvoid main(){float fromOff=u_progress*1.5;vec3 fromC=vec3(0.);for(int i=0;i<10;i++){float f=float(i)/10.;vec2 fuv=vec2(v_uv.x+fromOff+u_progress*.08*f,v_uv.y);fromC+=texture2D(u_from,clamp(fuv,0.,1.)).rgb;}fromC/=10.;float toOff=(1.-u_progress)*1.5;vec3 toC=vec3(0.);for(int i=0;i<10;i++){float f=float(i)/10.;vec2 tuv=vec2(v_uv.x-toOff-(1.-u_progress)*.08*f,v_uv.y);toC+=texture2D(u_to,clamp(tuv,0.,1.)).rgb;}toC/=10.;gl_FragColor=vec4(mix(fromC,toC,u_progress),1.);}";
  function compile(source, type) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source); gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader));
    }
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(vertex, gl.VERTEX_SHADER));
  gl.attachShader(program, compile(fragment, gl.FRAGMENT_SHADER));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
    gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'a_pos');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform1i(gl.getUniformLocation(program, 'u_from'), 0);
  gl.uniform1i(gl.getUniformLocation(program, 'u_to'), 1);
  gl.uniform2f(gl.getUniformLocation(program, 'u_resolution'), 1080, 1920);
  const progress = gl.getUniformLocation(program, 'u_progress');
  function load(folder, index) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.style.display = 'none';
      image.onload = () => {
        if (image.naturalWidth !== 1080 || image.naturalHeight !== 1920) {
          reject(new Error('Transition image dimensions must be 1080x1920')); return;
        }
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        resolve(texture);
      };
      image.onerror = () => reject(new Error('Missing transition image: ' + image.src));
      image.src = folder + '/' + String(index).padStart(3, '0') + '.png';
      root.append(image);
    });
  }
  const outgoing = [], incoming = [];
  const ready = Promise.all([
    ...Array.from({ length: half }, (_, i) => load('from', i).then(t => { outgoing[i] = t; })),
    ...Array.from({ length: half }, (_, i) => load('to', i).then(t => { incoming[i] = t; })),
  ]);
  function draw(time) {
    const n = Math.max(0, Math.min(frames - 1, Math.floor(time * fps + 1e-7)));
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, outgoing[Math.min(n, half - 1)]);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, incoming[Math.max(0, n - half)]);
    gl.uniform1f(progress, (n + 0.5) / frames);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.finish();
  }
  let time = 0;
  // HyperFrames 0.8.203 awaits promises registered synchronously on hf-seek.
  window.addEventListener('hf-seek', event => {
    const seekTime = event.detail.time;
    time = seekTime;
    event.detail.waitUntil(ready.then(() => draw(seekTime)));
  });
  ready.then(() => draw(time));
})();
</script></body></html>
