<html lang="en" data-composition-variables='[{"id":"paper_color","type":"color","label":"Paper color","default":"#F4F3EE"},{"id":"titlebar_color","type":"color","label":"Titlebar color","default":"#E4E1D8"},{"id":"bar_ink_color","type":"color","label":"Bar ink color","default":"#222222"},{"id":"ink_color","type":"color","label":"Ink color","default":"#222222"},{"id":"accent_color","type":"color","label":"Accent color","default":"#365A58"},{"id":"accent_ink_color","type":"color","label":"Accent ink color","default":"#FFFFFF"},{"id":"font_family","type":"string","label":"Font family","default":"\"Yap Studio Inter\", sans-serif"},{"id":"mono_family","type":"string","label":"Mono family","default":"\"Yap Studio Space Mono\", monospace"},{"id":"card_radius_px","type":"number","label":"Card radius px","default":16},{"id":"card_shadow","type":"string","label":"Card shadow","default":"0 10px 24px rgb(0 0 0 / 0.16)"},{"id":"panel_width_px","type":"number","label":"Panel width px","default":960},{"id":"panel_max_height_px","type":"number","label":"Panel max height px","default":272},{"id":"pad_x_px","type":"number","label":"Pad x px","default":40},{"id":"pad_top_px","type":"number","label":"Pad top px","default":24},{"id":"pad_bottom_px","type":"number","label":"Pad bottom px","default":64},{"id":"label","type":"string","label":"Label","default":""},{"id":"value","type":"number","label":"Value","default":0},{"id":"unit","type":"string","label":"Unit","default":"%"},{"id":"label_px","type":"number","label":"Label Px","default":36},{"id":"value_px","type":"number","label":"Value Px","default":88}]'>
<head>
<meta charset="utf-8">
<style>
/* BUNDLED_FONT_FACES */

* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#root { position: relative; display: flex; align-items: center; justify-content: center;
  padding: var(--card-pad-top) var(--card-pad-x) var(--card-pad-bottom);
  color: var(--card-ink); font-family: var(--card-font); isolation: isolate; }
.panel { width: var(--card-panel-width); max-height: var(--card-panel-height);
  background: var(--card-paper); border-radius: var(--card-radius); box-shadow: var(--card-shadow);
  padding: 24px; opacity: 0; overflow: hidden; }

.progress-panel { min-height: 205px; display: flex; flex-direction: column; justify-content: center; }
.progress-label { font-size: var(--card-label-size); font-weight: 600; }
.progress-value { font-size: var(--card-value-size); line-height: 1.05; font-weight: 700; font-variant-numeric: tabular-nums; }
.track { height: 13px; background: color-mix(in srgb, var(--card-ink) 16%, var(--card-paper)); border-radius: 8px; overflow: hidden; margin-top: 10px; }
.fill { height: 100%; background: var(--card-accent); transform-origin: left; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="progress_stat" data-start="0" data-width="1040" data-height="360" data-duration="3">
<div class="panel progress-panel"><div class="progress-label"></div><div class="progress-value"></div><div class="track"><div class="fill"></div></div></div>
</div>
<script>
(function () {
  "use strict";
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  const panel = root.querySelector(".panel");
  const tokens = {
    "paper": v.paper_color, "titlebar": v.titlebar_color, "bar-ink": v.bar_ink_color,
    "ink": v.ink_color, "accent": v.accent_color, "accent-ink": v.accent_ink_color,
    "font": v.font_family, "mono": v.mono_family, "radius": `${v.card_radius_px}px`,
    "shadow": v.card_shadow, "panel-width": `${v.panel_width_px}px`,
    "panel-height": `${v.panel_max_height_px}px`, "pad-x": `${v.pad_x_px}px`,
    "pad-top": `${v.pad_top_px}px`, "pad-bottom": `${v.pad_bottom_px}px`,
  };
  for (const [name, value] of Object.entries(tokens)) {
    root.style.setProperty(`--card-${name}`, value, "important");
  }
  root.style.width = `${root.dataset.width}px`;
  root.style.height = `${root.dataset.height}px`;
  const duration = Number(root.dataset.duration);
  const OUT = Math.min(0.3, duration * 0.15);
  const outStart = duration - OUT;
  function px(name, value) { root.style.setProperty(`--card-${name}`, `${value}px`, "important"); }
  gsap.set(panel, { opacity: 0, y: 8 });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(panel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: Math.min(0.3, outStart), ease: "power3.out" }, 0);

px("label-size", v.label_px); px("value-size", v.value_px);
root.querySelector(".progress-label").textContent = v.label;
root.querySelector(".progress-value").textContent = `${v.value}${v.unit}`;
const fill = root.querySelector(".fill"); fill.style.width = `${v.value}%`;
tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 0.85, ease: "power2.out" }, 0.25);

  tl.fromTo(panel, { opacity: 1 }, { opacity: 0, duration: OUT, ease: "power2.in", immediateRender: false }, outStart);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["progress_stat"] = tl;
})();
</script>
</body>
</html>
