<html lang="en" data-composition-variables='[{"id":"paper_color","type":"color","label":"Paper color","default":"#F4F3EE"},{"id":"titlebar_color","type":"color","label":"Titlebar color","default":"#E4E1D8"},{"id":"bar_ink_color","type":"color","label":"Bar ink color","default":"#222222"},{"id":"ink_color","type":"color","label":"Ink color","default":"#222222"},{"id":"accent_color","type":"color","label":"Accent color","default":"#365A58"},{"id":"accent_ink_color","type":"color","label":"Accent ink color","default":"#FFFFFF"},{"id":"font_family","type":"string","label":"Font family","default":"\"Yap Studio Inter\", sans-serif"},{"id":"mono_family","type":"string","label":"Mono family","default":"\"Yap Studio Space Mono\", monospace"},{"id":"card_radius_px","type":"number","label":"Card radius px","default":16},{"id":"card_shadow","type":"string","label":"Card shadow","default":"0 10px 24px rgb(0 0 0 / 0.16)"},{"id":"panel_width_px","type":"number","label":"Panel width px","default":960},{"id":"panel_max_height_px","type":"number","label":"Panel max height px","default":272},{"id":"pad_x_px","type":"number","label":"Pad x px","default":40},{"id":"pad_top_px","type":"number","label":"Pad top px","default":24},{"id":"pad_bottom_px","type":"number","label":"Pad bottom px","default":64},{"id":"items","type":"string","label":"Items","default":"[]"},{"id":"cues","type":"string","label":"Cues","default":"[]"},{"id":"text_px","type":"number","label":"Text px","default":44}]'>
<head>
<meta charset="utf-8">
<style>
/* BUNDLED_FONT_FACES */
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#root {
  position: relative; display: flex; align-items: center; justify-content: center;
  padding: var(--card-pad-top) var(--card-pad-x) var(--card-pad-bottom);
  background: transparent; color: var(--card-ink); font-family: var(--card-font);
  isolation: isolate; pointer-events: none;
}
.panel {
  width: var(--card-panel-width); max-height: var(--card-panel-height);
  background: var(--card-paper); border-radius: var(--card-radius);
  box-shadow: var(--card-shadow); transform-origin: 50% 60%;
  padding: 24px; opacity: 0;
}
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: flex-start; gap: 16px; }
.tick { flex: 0 0 auto; will-change: transform; width: calc(var(--card-text-size) * 1.3);
  height: calc(var(--card-text-size) * 1.3); }
.tick circle { fill: color-mix(in srgb, var(--card-accent) 18%, var(--card-paper)); }
.tick path { fill: none; stroke: var(--card-accent); stroke-width: 5;
  stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 36; stroke-dashoffset: 36; }
.label-body { min-width: 0; }
.label { font-size: var(--card-text-size); line-height: 1.3; font-weight: 600; white-space: nowrap; }
.line { margin-top: 5px; height: 2px; border-radius: 2px;
  background: color-mix(in srgb, var(--card-ink) 14%, transparent); }
.line-fill { height: 100%; background: var(--card-accent); transform-origin: left center; }
.tick-source { display: none; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="checklist" data-start="0" data-width="1040" data-height="360" data-duration="3">
<div class="panel"><div class="rows"></div></div>
<svg class="tick-source" viewBox="0 0 64 64" aria-hidden="true">
<circle cx="32" cy="32" r="27"></circle><path d="M20 33.5l8 8L45 23"></path></svg>
</div>
<script>
(function () {
    "use strict";
    const v = window.__hyperframes.getVariables();
    const root = document.getElementById("root");
    const panel = root.querySelector(".panel");
    const tokens = {
      "paper": v.paper_color, "titlebar": v.titlebar_color, "bar-ink": v.bar_ink_color,
      "ink": v.ink_color, "accent": v.accent_color, "accent-ink": v.accent_ink_color,
      "font": v.font_family, "mono": v.mono_family, "radius": `${v.card_radius_px}px`,
      "shadow": v.card_shadow, "panel-width": `${v.panel_width_px}px`,
      "panel-height": `${v.panel_max_height_px}px`, "pad-x": `${v.pad_x_px}px`,
      "pad-top": `${v.pad_top_px}px`, "pad-bottom": `${v.pad_bottom_px}px`,
    };
    for (const [name, value] of Object.entries(tokens)) {
      root.style.setProperty(`--card-${name}`, value, "important");
    }
    root.style.width = `${root.dataset.width}px`;
    root.style.height = `${root.dataset.height}px`;
    const duration = Number(root.dataset.duration);
    const OUT = Math.min(0.3, duration * 0.15);
    const outStart = duration - OUT;
    function px(name, value) {
      root.style.setProperty(`--card-${name}`, `${value}px`, "important");
    }
    function list(value, coerce) {
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed.map(coerce) : [];
      } catch (_) { return []; }
    }
    px("text-size", v.text_px);
    const items = list(v.items, String);
    const cues = list(v.cues, Number);
    const prototype = root.querySelector(".tick-source");
    const naturalEnd = 0.3 + Math.max(0, items.length - 1) * 0.35 + 0.65;
    const scale = Math.min(1, outStart / naturalEnd);
    const IN = 0.3 * scale;
    gsap.set(panel, { opacity: 0, y: 8 });
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(panel, { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: IN, ease: "power3.out" }, 0);
    let previous = 0;
    items.forEach(function (item, i) {
      const row = document.createElement("div");
      row.className = "row";
      const tick = prototype.cloneNode(true);
      tick.setAttribute("class", "tick");
      const body = document.createElement("div");
      body.className = "label-body";
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = item;
      const line = document.createElement("div");
      line.className = "line";
      const fill = document.createElement("div");
      fill.className = "line-fill";
      line.appendChild(fill);
      body.appendChild(label);
      body.appendChild(line);
      row.appendChild(tick);
      row.appendChild(body);
      root.querySelector(".rows").appendChild(row);
      const at = i < cues.length ? cues[i] : Math.min(outStart,
        i && cues.length ? previous + 0.35 * scale : (0.3 + i * 0.35) * scale);
      previous = at;
      const motion = Math.min(scale, Math.max(0, outStart - at) / 0.65);
      const path = tick.querySelector("path");
      gsap.set(row, { opacity: 0, y: 10 });
      gsap.set(tick, { opacity: 0, scale: 0.72, rotation: -18 });
      gsap.set(path, { strokeDashoffset: 36 });
      gsap.set(fill, { scaleX: 0 });
      tl.fromTo(row, { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.28 * motion, ease: "power3.out" }, at);
      tl.fromTo(tick, { opacity: 0, scale: 0.72, rotation: -18 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.34 * motion, ease: "back.out(1.8)" },
        at + 0.12 * motion);
      tl.fromTo(path, { strokeDashoffset: 36 },
        { strokeDashoffset: 0, duration: 0.42 * motion, ease: "power2.out" }, at + 0.16 * motion);
      tl.fromTo(fill, { scaleX: 0 },
        { scaleX: 1, duration: 0.35 * motion, ease: "power2.inOut" }, at + 0.3 * motion);
    });
    tl.fromTo(panel, { opacity: 1 },
      { opacity: 0, duration: OUT, ease: "power2.in", immediateRender: false }, outStart);
    tl.seek(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["checklist"] = tl;
})();
</script>
