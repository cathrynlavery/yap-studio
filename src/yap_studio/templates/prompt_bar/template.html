<head>
<meta charset="utf-8">
<style>
/* BUNDLED_FONT_FACES */
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#root {
  position: relative; display: flex; align-items: center; justify-content: center;
  padding: var(--card-pad-top) var(--card-pad-x) var(--card-pad-bottom);
  color: var(--card-ink); font-family: var(--card-font);
  isolation: isolate; pointer-events: none;
}
.panel {
  width: var(--card-panel-width); height: min(120px, var(--card-panel-height));
  border-radius: calc(min(120px, var(--card-panel-height)) / 2);
  background: var(--card-paper); box-shadow: var(--card-shadow);
  display: flex; align-items: center; gap: 24px; padding: 0 36px; opacity: 0;
}
.line {
  position: relative; flex: 1; min-width: 0; white-space: pre;
  font-size: var(--card-text-size); font-weight: 500; line-height: 1.2;
}
.placeholder {
  position: absolute; left: 0; top: 0;
  color: color-mix(in srgb, var(--card-ink) 55%, var(--card-paper));
}
.caret {
  display: inline-block; width: max(3px, 0.06em); height: 1.1em;
  background: var(--card-accent); vertical-align: text-bottom;
}
.send {
  position: relative; flex: 0 0 76px; height: 76px; border-radius: 50%;
  background: var(--card-accent); color: var(--card-accent-ink);
}
.send svg {
  position: absolute; width: 64px; height: 64px; left: 6px; top: 6px;
  fill: none; stroke: currentColor; stroke-width: 5;
  stroke-linecap: round; stroke-linejoin: round;
}
.check { stroke-dasharray: 36; stroke-dashoffset: 36; }
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="prompt_bar" data-start="0" data-width="1040" data-height="360" data-duration="3">
<div class="panel">
  <div class="line"><span class="placeholder"></span><span class="typed"></span><span class="caret"></span></div>
  <div class="send" aria-hidden="true">
    <svg viewBox="0 0 64 64"><path class="arrow" d="M32 45V20m-12 12 12-12 12 12"></path><path class="check" pathLength="36" d="M20 33.5l8 8L45 23"></path></svg>
  </div>
</div>
</div>
<script>
(function () {
  "use strict";
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  const panel = root.querySelector(".panel");
  const tokens = {
    "paper": v.paper_color, "titlebar": v.titlebar_color, "bar-ink": v.bar_ink_color,
    "ink": v.ink_color, "accent": v.accent_color, "accent-ink": v.accent_ink_color,
    "font": v.font_family, "mono": v.mono_family, "radius": `${v.card_radius_px}px`,
    "shadow": v.card_shadow, "panel-width": `${v.panel_width_px}px`,
    "panel-height": `${v.panel_max_height_px}px`, "pad-x": `${v.pad_x_px}px`,
    "pad-top": `${v.pad_top_px}px`, "pad-bottom": `${v.pad_bottom_px}px`,
  };
  for (const [name, value] of Object.entries(tokens)) {
    root.style.setProperty(`--card-${name}`, value, "important");
  }
  root.style.width = `${root.dataset.width}px`;
  root.style.height = `${root.dataset.height}px`;
  root.style.setProperty("--card-text-size", `${v.text_px}px`, "important");
  const duration = Number(root.dataset.duration);
  const OUT = Math.min(0.3, duration * 0.15);
  const outStart = duration - OUT;
  const schedule = JSON.parse(v.schedule);
  if (schedule.text !== v.request) {
    throw new Error("schedule must come from card_layer_plan for the same request");
  }
  const text = Array.from(v.request);
  const textNode = document.createTextNode("");
  root.querySelector(".typed").appendChild(textNode);
  const placeholder = root.querySelector(".placeholder");
  placeholder.textContent = v.placeholder;
  const caret = root.querySelector(".caret");
  const send = root.querySelector(".send");
  const arrow = root.querySelector(".arrow");
  const check = root.querySelector(".check");
  gsap.set(panel, { opacity: 0, y: 8 });
  gsap.set(caret, { opacity: 0 });
  gsap.set(arrow, { opacity: 1 });
  gsap.set(check, { strokeDashoffset: 36 });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(panel, { opacity: 0, y: 8 },
    { opacity: 1, y: 0, duration: Math.min(0.3, outStart), ease: "power3.out" }, 0);
  schedule.rows.forEach(([t, n]) =>
    tl.set(textNode, { textContent: text.slice(0, n).join("") }, t));
  tl.set(placeholder, { opacity: 1 }, 0);
  const firstCharacter = schedule.rows.find(([, n]) => n > 0);
  if (firstCharacter) tl.set(placeholder, { opacity: 0 }, firstCharacter[0]);
  const cycles = Math.max(1, Math.round((schedule.type_end - schedule.type_start) / 0.9));
  for (let phase = 0; phase < cycles * 2; phase += 1) {
    tl.set(caret, { opacity: phase % 2 === 0 ? 1 : 0 },
      schedule.type_start + (schedule.type_end - schedule.type_start) * phase / (cycles * 2));
  }
  tl.set(caret, { opacity: 1 }, schedule.type_end);
  tl.set(caret, { opacity: 0 }, schedule.confirm_at);
  tl.fromTo(arrow, { opacity: 1 },
    { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, schedule.confirm_at);
  tl.fromTo(check, { strokeDashoffset: 36 },
    { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, schedule.confirm_at);
  tl.fromTo(send, { scale: 1 },
    { scale: 1.08, duration: 0.2, ease: "power2.out" }, schedule.confirm_at);
  tl.fromTo(send, { scale: 1.08 },
    { scale: 1, duration: 0.2, ease: "power2.inOut", immediateRender: false }, schedule.confirm_at + 0.2);
  tl.fromTo(panel, { opacity: 1 },
    { opacity: 0, duration: OUT, ease: "power2.in", immediateRender: false }, outStart);
  tl.seek(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["prompt_bar"] = tl;
})();
</script>
</body>
