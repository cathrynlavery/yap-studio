<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f0">
<title>Yap Studio</title>
<link rel="stylesheet" href="/static/home.css">
<script type="module" src="/static/home.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the current step</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#videos" aria-label="Yap Studio, your videos"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2.5" width="18" height="19" rx="5" fill="currentColor"/><path d="M8.5 9.5h7M8.5 13h4.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>Yap Studio</a>
    <span class="workspace" id="workspace-name"></span>
    <p class="listener" id="listener" role="status" aria-live="polite"></p>
    <a class="link" id="phone-link" hidden></a>
  </div>
</header>
<p class="banner error connection" id="connection" role="status" aria-live="polite" hidden></p>
<div class="shell" id="shell">
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main class="main" id="main" tabindex="-1">
    <p class="loading" id="loading">Opening Yap Studio…</p>
  </main>
</div>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
<template id="text-hook-field">
  <div class="section field">
    <label for="text-hook">Text hook</label>
    <p id="text-hook-hint" class="note">Leave it empty and Claude will suggest three.</p>
    <textarea id="text-hook" rows="2" maxlength="80" aria-describedby="text-hook-hint text-hook-error"></textarea>
    <p id="text-hook-error" class="note" role="alert" hidden></p>
  </div>
</template>
</body>
</html>
